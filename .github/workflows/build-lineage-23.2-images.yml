name: Build locked Android 16 images

on:
  workflow_dispatch:
    inputs:
      imx8mm_variant:
        description: i.MX8MM build variant; user is the production-gated release path
        required: true
        default: userdebug
        type: choice
        options:
          - userdebug
          - user
      build_scope:
        description: Build both images, or rebuild only one target
        required: true
        default: all
        type: choice
        options:
          - all
          - x86_64
          - x86_64_2gb
          - imx8mm

permissions:
  contents: read

concurrency:
  group: build-lineage-23.2-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, esl-proxmox]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - name: Regression-test source lock validation
        run: python3 scripts/test-validate-lock.py
      - name: Install pinned Android repo launcher
        run: scripts/install-repo-tool.sh
      - name: Preflight CI storage
        run: |
          install -d /yocto/android-16-source/out /yocto/android-16-source/out-x86_64-2gb /yocto/android-16-artifacts /yocto/android-16-manifests
          available_kib=$(df --output=avail /yocto | tail -1 | tr -d ' ')
          minimum_kib=$((300 * 1024 * 1024))
          if [ "${available_kib}" -lt "${minimum_kib}" ]; then
            echo "Android build volume has less than 300 GiB free" >&2
            df -h /yocto >&2
            exit 1
          fi
          df -h / /yocto
      - name: Build selected Android image scope
        env:
          ANDROID_WORKSPACE: /yocto/android-16-source
          ANDROID_OUT_DIR: /yocto/android-16-source/out
          ANDROID_X86_64_2GB_OUT_DIR: /yocto/android-16-source/out-x86_64-2gb
          ANDROID_MANIFEST_CACHE_DIR: /yocto/android-16-manifests
          OUTPUT_DIR: /yocto/android-16-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
          JOBS: "8"
          SOONG_GOMEMLIMIT: 28GiB
          IMX8MM_BUILD_VARIANT: ${{ inputs.imx8mm_variant }}
          BUILD_SCOPE: ${{ inputs.build_scope }}
        run: scripts/build-images.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aesl-lineage-23.2-${{ github.run_id }}-${{ github.run_attempt }}
          path: /yocto/android-16-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
