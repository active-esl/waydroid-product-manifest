name: Build Android R16 / LineageOS 23.2 images
run-name: Android R16 / LineageOS 23.2 - ${{ inputs.build_scope == 'arm64_2gb' && 'Jaguar Screen i.MX8MM 2 GB' || inputs.build_scope == 'arm64_standard' && 'Generic ARM64 standard baseline' || inputs.build_scope == 'imx95_frdm' && 'FRDM i.MX95 standard vendor' || inputs.build_scope == 'x86_64' && 'Framework x86_64' || inputs.build_scope == 'x86_64_2gb' && 'Framework x86_64 2 GB' || 'multiple targets (x86_64 + ARM64 standard + ARM64 2 GB)' }} (${{ inputs.arm64_variant }})

on:
  workflow_dispatch:
    inputs:
      arm64_variant:
        description: ARM64 build variant; user is the production-gated release path
        required: true
        default: userdebug
        type: choice
        options:
          - userdebug
          - user
      build_scope:
        description: Build all targets or select one; FRDM i.MX95 requires reviewed vendor inputs
        required: true
        default: all
        type: choice
        options:
          - all
          - arm64_standard
          - arm64_2gb
          - imx95_frdm
          - x86_64
          - x86_64_2gb
      continuation_thread_id:
        description: Optional Codex task UUID to resume on this exact FRDM run result
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: build-lineage-23.2-images
  cancel-in-progress: false

jobs:
  build:
    name: Android R16 / LineageOS 23.2 - ${{ inputs.build_scope == 'arm64_2gb' && 'Jaguar Screen i.MX8MM 2 GB' || inputs.build_scope == 'arm64_standard' && 'Generic ARM64 standard baseline' || inputs.build_scope == 'imx95_frdm' && 'FRDM i.MX95 standard vendor' || inputs.build_scope == 'x86_64' && 'Framework x86_64' || inputs.build_scope == 'x86_64_2gb' && 'Framework x86_64 2 GB' || 'multiple targets (x86_64 + ARM64 standard + ARM64 2 GB)' }}
    runs-on: [self-hosted, esl-proxmox]
    # A first build in a new target-specific OUT_DIR has no compiled-object
    # cache. Leave enough headroom for the cold build while subsequent runs
    # reuse the persistent /yocto output tree.
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Register exact FRDM run continuation before long work
        if: ${{ inputs.build_scope == 'imx95_frdm' && inputs.continuation_thread_id != '' }}
        env:
          JEV_CI_ADVISORY_HMAC_SECRET: ${{ secrets.JEV_CI_ADVISORY_HMAC_SECRET }}
        run: |
          python3 scripts/register-ci-wait.py \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --thread-id "${{ inputs.continuation_thread_id }}"
      - name: Regression-test source lock validation
        run: |
          python3 scripts/test-validate-lock.py
          python3 scripts/test-lock-delta.py
          python3 scripts/test-patch-state.py
      - name: Regression-test checked-out source lock gate
        run: python3 scripts/test-worktree-lock-drift.py
      - name: Regression-test Android CI resource policy
        run: |
          python3 scripts/test-build-resource-policy.py
          python3 scripts/test-jev-ci-advisory.py
      - name: Install pinned Android repo launcher
        run: scripts/install-repo-tool.sh
      - name: Preflight CI storage
        run: |
          install -d /yocto/android-16-source/out-x86_64 /yocto/android-16-source/out-x86_64-2gb /yocto/android-16-source/out-arm64-standard /yocto/android-16-source/out-arm64-2gb /yocto/android-16-source/out-imx95-frdm /yocto/android-16-artifacts /yocto/android-16-manifests
          available_kib=$(df --output=avail /yocto | tail -1 | tr -d ' ')
          minimum_kib=$((300 * 1024 * 1024))
          if [ "${available_kib}" -lt "${minimum_kib}" ]; then
            echo "Android build volume has less than 300 GiB free" >&2
            df -h /yocto >&2
            exit 1
          fi
          df -h / /yocto
      - name: Build Android R16 / LineageOS 23.2 image scope
        id: build-images
        env:
          ANDROID_WORKSPACE: /yocto/android-16-source
          ANDROID_X86_64_OUT_DIR: /yocto/android-16-source/out-x86_64
          ANDROID_X86_64_2GB_OUT_DIR: /yocto/android-16-source/out-x86_64-2gb
          ANDROID_ARM64_STANDARD_OUT_DIR: /yocto/android-16-source/out-arm64-standard
          ANDROID_ARM64_2GB_OUT_DIR: /yocto/android-16-source/out-arm64-2gb
          ANDROID_IMX95_OUT_DIR: /yocto/android-16-source/out-imx95-frdm
          ANDROID_MANIFEST_CACHE_DIR: /yocto/android-16-manifests
          OUTPUT_DIR: /yocto/android-16-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
          # CT101 has a six-CPU cgroup quota. Do not create excess runnable and
          # I/O pressure by asking Ninja for more parallelism than the quota.
          JOBS: "6"
          SOONG_GOMEMLIMIT: 28GiB
          # This dedicated CI workspace may discard audited untracked source
          # residue. Developer invocations fail closed unless they opt in.
          AESL_ALLOW_LOCKED_SOURCE_CLEANUP: "true"
          ARM64_BUILD_VARIANT: ${{ inputs.arm64_variant }}
          BUILD_SCOPE: ${{ inputs.build_scope }}
        run: |
          install -d "${RUNNER_TEMP}/jev-ci"
          set -o pipefail
          python3 scripts/ci-fail-fast.py \
            --evidence-output "${RUNNER_TEMP}/jev-ci/first-failure.json" \
            -- scripts/build-images.sh \
            | tee "${RUNNER_TEMP}/jev-ci/android-frdm-build.log"
      - name: Create non-required Jev advisory for an FRDM build failure
        if: ${{ failure() && inputs.build_scope == 'imx95_frdm' && steps.build-images.outcome == 'failure' }}
        continue-on-error: true
        env:
          JEV_CI_ADVISORY_HMAC_SECRET: ${{ secrets.JEV_CI_ADVISORY_HMAC_SECRET }}
          JEV_OUTPUT_DIR: ${{ runner.temp }}/jev-ci/advisory
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          context = {
              "failed_job": "Android R16 / LineageOS 23.2 - FRDM i.MX95 standard vendor",
              "failed_step": "Build Android R16 / LineageOS 23.2 image scope",
              "build_system": "android-soong-ninja",
              "board": "imx95-frdm",
              "build_target": "imx95_frdm",
              "tuple": "android-r16:lineageos-23.2:imx95-frdm:standard:arm64",
              "artifact_name": "android-r16-frdm-${{ github.run_id }}-${{ github.run_attempt }}",
          }
          output = Path(os.environ["JEV_OUTPUT_DIR"])
          output.mkdir(parents=True, exist_ok=True)
          (output / "context.json").write_text(json.dumps(context), encoding="utf-8")
          PY
          python3 scripts/request-jev-ci-advisory.py \
            --log "${RUNNER_TEMP}/jev-ci/android-frdm-build.log" \
            --context "${JEV_OUTPUT_DIR}/context.json" \
            --request-id "github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}" \
            --output-dir "${JEV_OUTPUT_DIR}"
          rm -f "${JEV_OUTPUT_DIR}/context.json"
      - name: Upload non-required Jev FRDM failure advisory
        if: ${{ failure() && inputs.build_scope == 'imx95_frdm' && steps.build-images.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jev-ci-advisory-frdm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/jev-ci/advisory/jev-ci-advisory.json
            ${{ runner.temp }}/jev-ci/advisory/jev-ci-advisory.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Attest Android R16 build provenance
        id: attest-provenance
        if: success()
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: /yocto/android-16-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/SHA256SUMS
      - name: Retain signed provenance bundle with release evidence
        if: success()
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
          OUTPUT_DIR: /yocto/android-16-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
        run: install -m 0644 "${ATTESTATION_BUNDLE}" "${OUTPUT_DIR}/provenance.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        # The FRDM vendor image may contain licence-controlled GPU/media
        # components. Retain it on the runner until redistribution is reviewed.
        if: ${{ always() && inputs.build_scope != 'imx95_frdm' }}
        with:
          name: aesl-android-r16-${{ inputs.build_scope == 'arm64_2gb' && 'imx8mm-jaguar-screen-2gb' || inputs.build_scope == 'arm64_standard' && 'generic-arm64-standard-baseline' || inputs.build_scope == 'imx95_frdm' && 'frdm-imx95-standard-vendor' || inputs.build_scope == 'x86_64' && 'framework-x86_64' || inputs.build_scope == 'x86_64_2gb' && 'framework-x86_64-2gb' || 'multiple-targets-x86_64-arm64-standard-2gb' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /yocto/android-16-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
      - name: Locate private FRDM build evidence
        if: ${{ always() && inputs.build_scope == 'imx95_frdm' }}
        run: |
          echo 'FRDM build evidence remains on the self-hosted runner at:' >> "$GITHUB_STEP_SUMMARY"
          echo '/yocto/android-16-artifacts/${{ github.run_id }}-${{ github.run_attempt }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Emit FRDM build-success continuation event
        if: ${{ success() && inputs.build_scope == 'imx95_frdm' }}
        continue-on-error: true
        env:
          JEV_CI_ADVISORY_HMAC_SECRET: ${{ secrets.JEV_CI_ADVISORY_HMAC_SECRET }}
        run: |
          python3 scripts/emit-ci-completion.py \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --commit-sha "${{ github.sha }}"
