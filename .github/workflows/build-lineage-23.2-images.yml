name: Build Android R16 / LineageOS 23.2 images
run-name: Android R16 / LineageOS 23.2 - ${{ inputs.build_scope == 'arm64_2gb' && 'Jaguar Screen i.MX8MM 2 GB' || inputs.build_scope == 'arm64_standard' && 'i.MX8MM standard vendor candidate' || inputs.build_scope == 'x86_64' && 'Framework x86_64' || inputs.build_scope == 'x86_64_2gb' && 'Framework x86_64 2 GB' || 'multiple targets (Framework + i.MX8MM)' }} (${{ inputs.arm64_variant }})

on:
  workflow_dispatch:
    inputs:
      arm64_variant:
        description: ARM64 build variant; user is the production-gated release path
        required: true
        default: userdebug
        type: choice
        options:
          - userdebug
          - user
      build_scope:
        description: Build all targets or select one target; i.MX95 requires its reviewed vendor inputs
        required: true
        default: all
        type: choice
        options:
          - all
          - arm64_standard
          - arm64_2gb
          - imx95_frdm
          - x86_64
          - x86_64_2gb

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: build-lineage-23.2-images
  cancel-in-progress: false

jobs:
  build:
    name: Android R16 / LineageOS 23.2 - ${{ inputs.build_scope == 'arm64_2gb' && 'Jaguar Screen i.MX8MM 2 GB' || inputs.build_scope == 'arm64_standard' && 'i.MX8MM standard vendor candidate' || inputs.build_scope == 'x86_64' && 'Framework x86_64' || inputs.build_scope == 'x86_64_2gb' && 'Framework x86_64 2 GB' || 'multiple targets (Framework + i.MX8MM)' }}
    runs-on: [self-hosted, esl-proxmox]
    # A first build in a new target-specific OUT_DIR has no compiled-object
    # cache. Leave enough headroom for the cold build while subsequent runs
    # reuse the persistent /yocto output tree.
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Regression-test source lock validation
        run: python3 scripts/test-validate-lock.py
      - name: Regression-test Android CI resource policy
        run: python3 scripts/test-build-resource-policy.py
      - name: Install pinned Android repo launcher
        run: scripts/install-repo-tool.sh
      - name: Preflight CI storage
        run: |
          install -d /yocto/android-16-source/out-x86_64 /yocto/android-16-source/out-x86_64-2gb /yocto/android-16-source/out-arm64-standard /yocto/android-16-source/out-arm64-2gb /yocto/android-16-source/out-imx95-frdm /yocto/android-16-artifacts /yocto/android-16-manifests
          available_kib=$(df --output=avail /yocto | tail -1 | tr -d ' ')
          minimum_kib=$((300 * 1024 * 1024))
          if [ "${available_kib}" -lt "${minimum_kib}" ]; then
            echo "Android build volume has less than 300 GiB free" >&2
            df -h /yocto >&2
            exit 1
          fi
          df -h / /yocto
      - name: Build Android R16 / LineageOS 23.2 image scope
        env:
          ANDROID_WORKSPACE: /yocto/android-16-source
          ANDROID_X86_64_OUT_DIR: /yocto/android-16-source/out-x86_64
          ANDROID_X86_64_2GB_OUT_DIR: /yocto/android-16-source/out-x86_64-2gb
          ANDROID_ARM64_STANDARD_OUT_DIR: /yocto/android-16-source/out-arm64-standard
          ANDROID_ARM64_2GB_OUT_DIR: /yocto/android-16-source/out-arm64-2gb
          ANDROID_IMX95_OUT_DIR: /yocto/android-16-source/out-imx95-frdm
          ANDROID_MANIFEST_CACHE_DIR: /yocto/android-16-manifests
          OUTPUT_DIR: /yocto/android-16-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
          # CT101 has a six-CPU cgroup quota. Do not create excess runnable and
          # I/O pressure by asking Ninja for more parallelism than the quota.
          JOBS: "6"
          SOONG_GOMEMLIMIT: 28GiB
          ARM64_BUILD_VARIANT: ${{ inputs.arm64_variant }}
          BUILD_SCOPE: ${{ inputs.build_scope }}
        run: scripts/build-images.sh
      - name: Attest Android R16 build provenance
        id: attest-provenance
        if: success()
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: /yocto/android-16-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/SHA256SUMS
      - name: Retain signed provenance bundle with release evidence
        if: success()
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
          OUTPUT_DIR: /yocto/android-16-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
        run: install -m 0644 "${ATTESTATION_BUNDLE}" "${OUTPUT_DIR}/provenance.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: aesl-android-r16-${{ inputs.build_scope == 'arm64_2gb' && 'imx8mm-jaguar-screen-2gb' || inputs.build_scope == 'arm64_standard' && 'imx8mm-standard-candidate' || inputs.build_scope == 'x86_64' && 'framework-x86_64' || inputs.build_scope == 'x86_64_2gb' && 'framework-x86_64-2gb' || 'multiple-targets-framework-imx8mm' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /yocto/android-16-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
