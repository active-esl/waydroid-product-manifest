name: Resolve Android 16 source lock

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resolve-lineage-23.2-lock
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: [self-hosted, esl-proxmox]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Android repo launcher
        run: |
          install -d "${RUNNER_TEMP}/android-repo/bin"
          curl --fail --silent --show-error --location \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "${RUNNER_TEMP}/android-repo/bin/repo"
          echo "1211b57b57e4122a9c546295a59b37d24068f1164d0e87bef096d5323c413e4f  ${RUNNER_TEMP}/android-repo/bin/repo" \
            | sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/android-repo/bin/repo"
          echo "${RUNNER_TEMP}/android-repo/bin" >> "${GITHUB_PATH}"
      - name: Preflight Android source storage
        run: |
          install -d /yocto/android-16-source
          available_kib=$(df --output=avail /yocto | tail -1 | tr -d ' ')
          minimum_kib=$((300 * 1024 * 1024))
          if [ "${available_kib}" -lt "${minimum_kib}" ]; then
            echo "Android source volume has less than 300 GiB free" >&2
            df -h /yocto >&2
            exit 1
          fi
          df -h / /yocto
      - name: Resolve complete immutable manifest
        env:
          ANDROID_WORKSPACE: /yocto/android-16-source
          LOCK_OUTPUT: ${{ github.workspace }}/lineage-23.2-lock.xml
          JOBS: "4"
        run: ./scripts/resolve-lock.sh
      - uses: actions/upload-artifact@v7
        with:
          name: lineage-23.2-source-lock
          path: lineage-23.2-lock.xml
          if-no-files-found: error
          retention-days: 30
